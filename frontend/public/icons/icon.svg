<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Decorative Outer Circle -->
  <circle cx="256" cy="235" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Center Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Classic Portal Building / Pillars -->
    <!-- Base -->
    <rect x="136" y="310" width="240" height="20" rx="4" fill="url(#goldGrad)"/>
    <rect x="150" y="296" width="212" height="14" rx="3" fill="#ffffff"/>

    <!-- Pillars (4 columns) -->
    <rect x="166" y="195" width="24" height="100" rx="4" fill="url(#shieldGrad)"/>
    <rect x="216" y="195" width="24" height="100" rx="4" fill="url(#shieldGrad)"/>
    <rect x="272" y="195" width="24" height="100" rx="4" fill="url(#shieldGrad)"/>
    <rect x="322" y="195" width="24" height="100" rx="4" fill="url(#shieldGrad)"/>

    <!-- Pillar Caps -->
    <rect x="160" y="185" width="36" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="210" y="185" width="36" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="266" y="185" width="36" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="316" y="185" width="36" height="10" rx="2" fill="url(#goldGrad)"/>

    <!-- Pediment / Roof Triangle -->
    <path d="M 140 185 L 256 105 L 372 185 Z" fill="url(#goldGrad)"/>
    <path d="M 165 178 L 256 115 L 347 178 Z" fill="#1e293b"/>

    <!-- Center Peace & Love Heart Emblem inside Roof -->
    <path d="M 256 160 C 256 160, 240 142, 240 134 C 240 128, 245 124, 250 124 C 253 124, 255 126, 256 128 C 257 126, 259 124, 262 124 C 267 124, 272 128, 272 134 C 272 142, 256 160, 256 160 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Banner Text -->
  <text x="256" y="380" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="2">PEACE &amp; LOVE</text>
  <text x="256" y="415" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="4">ADROABAA</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">DUES &amp; MEMBERSHIP PORTAL</text>
</svg>

