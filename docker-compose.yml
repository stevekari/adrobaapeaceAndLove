services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: change-this-jwt-secret-in-production
    ports:
      - "8090:8090"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8090
    ports:
      - "3000:80"
    depends_on:
      - backend
